<!DOCTYPE html>
<html>
<head>
  <title>Auto Clicker</title>
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      cursor: pointer;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 5px;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h2>🖱️ Auto Clicker</h2>

  <button id="selectLocation">Select Click Location</button>

  <label for="speed">Click speed (clicks per second):</label>
  <input
    type="number"
    id="speed"
    min="1"
    max="100"
    value="10"
  >

  <button id="start">▶ Start</button>
  <button id="stop">⏹ Stop</button>

  <div id="status">Location: Not selected</div>

  <script src="popup.js"></script>
</body>
</html>]\9
